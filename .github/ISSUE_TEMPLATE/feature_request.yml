name: "Feature request"
description: "Propose a focused improvement."
title: "[Feature] "
labels:
  - "enhancement"
body:
  - type: textarea
    id: problem
    attributes:
      label: "Editorial or technical problem"
      description: "Explain the workflow that is difficult today."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior"
      description: "Describe the command, metric, or output behavior you would expect."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy check"
      options:
        - label: "This request contains no confidential manuscript text or credentials."
          required: true
